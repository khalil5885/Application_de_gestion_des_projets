server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    
    # 1. Route for the React Frontend
    # This points to where your React build files are or proxies to the dev server
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Route for Laravel API & Sanctum
    # Any request starting with /api or /sanctum goes to the Laravel container [2, 3]
    location ~ ^/(api|sanctum) {
        # 'laravel' must match the service name in your docker-compose.yml
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 3. Security and Optimization
    location ~ /\.ht {
        deny all;
    }
}